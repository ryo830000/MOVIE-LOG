<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Movie Log</title>
<meta name="theme-color" content="#0e1016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Movie Log">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
:root{--bg:#0e1016;--card:#171a23;--card2:#1f2331;--line:#2b3042;--text:#eef0f5;--muted:#8d95aa;--gold:#f5c04a;--red:#e5484d;--green:#3ecf8e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;font-size:15px;line-height:1.5}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:84px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#app>header{flex:none;width:100%;max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px}
header h1{font-size:18px;margin:0;letter-spacing:.02em}
header h1 span{color:var(--gold)}
#status{font-size:12px;color:var(--muted)}
main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;width:100%;max-width:560px;margin:0 auto;padding:10px 14px 24px}
nav{flex:none;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:0;padding:9px 0 8px;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--gold)}
h2{font-size:16px;margin:18px 0 8px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.sec>h3{font-size:13px;color:var(--muted);margin:0 0 10px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12px}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.btn.primary{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
.btn.danger{color:#ff7a7e;border-color:#5a2a2d}
.btn.block{width:100%;padding:13px}
.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:0 0 auto}.row>.grow{flex:1 1 auto;min-width:0}
.li{display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:6px}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12px;color:var(--muted);white-space:nowrap}
.li.add{border-style:dashed;color:var(--gold)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.chip{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card2);border:1px solid var(--gold);border-radius:10px;padding:10px 12px}
.chip b{overflow:hidden;text-overflow:ellipsis}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:20px}
.stepper .v{min-width:70px;text-align:center;font-weight:700;font-size:17px}
.srow{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line)}
.srow:last-of-type{border-bottom:0}
.sl{width:86px;font-size:13px;flex:0 0 auto}
.stars{display:flex;flex:0 0 auto}
.star{position:relative;width:30px;height:30px;display:block}
.star .base,.star .fill{position:absolute;left:0;top:0;height:30px;overflow:hidden;display:block}
.star .base{width:30px}
.star svg{width:30px;height:30px;display:block}
.star .base svg{fill:#343a4f}
.star .fill svg{fill:var(--gold)}
.star .fill{width:0}
.star b{position:absolute;top:0;height:30px;width:15px;display:block}
.star .hl{left:0}.star .hr{left:15px}
.zero{margin-left:auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--muted);font-size:13px;padding:0}
.zero.on{border-color:var(--gold);color:var(--gold)}
.sv{width:30px;text-align:right;font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums}
.avgline{margin-top:10px;padding:10px 12px;background:var(--card2);border-radius:10px;font-size:14px}
.avgline b{color:var(--gold);font-size:18px}
label.f{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 12px 0 0;margin-bottom:6px;overflow:hidden;min-height:48px}
.lrow .bar{width:6px;align-self:stretch;flex:0 0 auto}
.lrow .tt{flex:1;min-width:0;font-weight:600;padding:9px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .mt{flex:0 0 auto;font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.lrow .mt b{color:var(--gold)}
.lrow .cn{font-size:11px;color:var(--gold);border:1px solid #6a5420;border-radius:999px;padding:0 6px;flex:0 0 auto}
.card{position:relative;border-radius:12px;overflow:hidden;min-height:92px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line);text-align:left;width:100%}
.card .tt{font-weight:800;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.card .ft{font-size:11px;color:#ffffffcc}
.card .bd{position:absolute;top:6px;right:6px;background:#000a;border-radius:999px;padding:1px 8px;font-size:12px;color:var(--gold)}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;background:none;border:0;border-radius:8px;padding:7px 4px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--gold);color:#1a1405;font-weight:700}
.rk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.rk .no{width:32px;text-align:center;font-weight:800;font-size:18px;color:var(--muted);flex:0 0 auto}
.rk.r1 .no{color:#ffd24d}.rk.r2 .no{color:#cfd6e6}.rk.r3 .no{color:#d98c55}
.rk .nm{flex:1;min-width:0}
.rk .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .nm span{font-size:12px;color:var(--muted)}
.rk .val{font-weight:800;color:var(--gold);white-space:nowrap}
.tier{display:flex;gap:10px;margin-bottom:8px;align-items:stretch}
.tier .tl{width:46px;flex:0 0 auto;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:#14110a}
.tier .tb{flex:1;display:flex;flex-wrap:wrap;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:46px;align-content:flex-start}
.tc{background:var(--card2);border-radius:8px;padding:4px 8px;font-size:12px;line-height:1.35}
.tc i{font-style:normal;color:var(--muted);margin-left:4px}
.tc em{font-style:normal;color:var(--gold);margin-left:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile .n{font-size:26px;font-weight:800;color:var(--gold)}
.tile .l{font-size:12px;color:var(--muted)}
.meter{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.meter .a{width:92px;flex:0 0 auto}
.meter .bar{flex:1;height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--gold)}
.meter .b{width:34px;text-align:right;font-variant-numeric:tabular-nums}
#detail{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;overscroll-behavior:contain;display:none;padding-top:env(safe-area-inset-top)}
#detail.on{display:block}
#detail .in{max-width:560px;margin:0 auto;padding:10px 14px calc(30px + env(safe-area-inset-bottom))}
.wc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.wh{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.wh b{font-size:16px}.wh .sc{margin-left:auto;font-weight:800;color:var(--gold);font-size:18px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;font-size:13px}
.mini div{display:flex;justify-content:space-between}
.mini span:last-child{color:var(--gold)}
.cm{margin:8px 0 0;padding:8px 10px;background:var(--card2);border-radius:10px;white-space:pre-wrap;word-break:break-word}
.modal{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:420px;max-height:80vh;overflow:auto}
.mbox h3{margin:0 0 8px;font-size:16px}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:#2b3042;border:1px solid var(--line);padding:9px 14px;border-radius:999px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.tin{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tin div{font-size:12px;color:var(--muted)}
.card{aspect-ratio:2/3;min-height:0}
.card.hasp{justify-content:flex-end;background-size:cover;background-position:center}
.card.hasp .tt{font-size:12px;margin-bottom:4px;text-shadow:0 1px 3px #000}
.lrow .pt{width:34px;height:51px;object-fit:cover;flex:0 0 auto;display:block}
.tp{width:32px;height:48px;object-fit:cover;border-radius:4px;flex:0 0 auto;background:#2b3042;display:block}
.li.tmain{justify-content:flex-start;gap:10px}
.li .t{flex:1;min-width:0}
.li small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.tr{display:flex;gap:6px;margin-top:6px;align-items:stretch}
.tr .li{margin-top:0;flex:1;min-width:0}
.dp{width:92px;border-radius:8px;flex:0 0 auto;display:block}
.cp{width:28px;height:42px;object-fit:cover;border-radius:4px;flex:0 0 auto}
</style>
</head>
<body>
<div id="app">
  <header><h1>🎬 Movie <span>Log</span></h1><div id="status">読み込み中…</div></header>
  <main id="main"></main>
  <nav><div class="in" id="nav"></div></nav>
</div>
<div id="detail"><div class="in" id="detailIn"></div></div>
<div id="toast"></div>

<script>
"use strict";
/* ---------- 定数 ---------- */
var ITEMS=['ストーリー','キャラ・演技','映像','音楽・音','満足感'];
var DEF_TIERS={star:{S:4.5,A:4,B:3.5,C:3},score:{S:90,A:80,B:70,C:60}};
var TIER_ORDER=['S','A','B','C','D'];
var TIER_COL={S:'#f5c04a',A:'#ff8a4c',B:'#4cc9a0',C:'#5aa7ff',D:'#9a8cff'};
var STAR_SVG='<svg viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>';
var TABS=[['record','🎞️','記録'],['lib','📚','一覧'],['rank','🏆','順位'],['tier','🧩','ティア'],['stat','📊','統計']];
var METRICS=[['avg','星の平均'],['score','100点'],['i0','ストーリー'],['i1','キャラ・演技'],['i2','映像'],['i3','音楽・音'],['i4','満足感'],['count','鑑賞回数']];

/* ---------- 状態 ---------- */
var mode='loading'; // cloud | local | loading
var docs={}; var M={}; var W=[]; var WM={}; var settings={tiers:clone(DEF_TIERS)};
var tab='record', detailId=null, dirty=false, loaded=false, loadSlow=false;
var libSort='recent', libQuery='', libView='list';
var rankMetric='avg', rankFilter='all';
var tierMode='star', tierFilter='all';
var form=newForm();
var col=null, dlApi=null;

function clone(o){return JSON.parse(JSON.stringify(o))}
function $(s,el){return (el||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fmtDate(s){return s?String(s).replace(/-/g,'/'):''}
function newId(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function newForm(){return {watchId:null,sel:null,query:'',n:1,stars:[null,null,null,null,null],score:'',comment:'',date:todayStr()}}

/* ---------- 名寄せ（表記ゆれ吸収） ---------- */
function norm(s){
  s=String(s||'').normalize('NFKC').toLowerCase();
  s=s.replace(/[ァ-ヶ]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0x60)});
  try{s=s.replace(/[\p{P}\p{S}\p{Z}\s]/gu,'')}catch(e){s=s.replace(/[\s!-\/:-@\[-`{-~]/g,'')}
  return s;
}
function lev(a,b){
  if(a===b)return 0; var m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  var prev=[],i,j; for(j=0;j<=n;j++)prev[j]=j;
  for(i=1;i<=m;i++){var cur=[i]; for(j=1;j<=n;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1))} prev=cur}
  return prev[n];
}

/* ---------- データ導出 ---------- */
function mergeTiers(t){
  var r=clone(DEF_TIERS); if(!t||typeof t!=='object')return r;
  ['star','score'].forEach(function(k){ if(t[k])['S','A','B','C'].forEach(function(x){var v=Number(t[k][x]); if(isFinite(v))r[k][x]=v}) });
  return r;
}
function avgOf(w){var s=0;for(var i=0;i<5;i++)s+=w.stars[i];return Math.round(s*2)/10}
function cmpLatest(a,b){return (a.n-b.n)||(a.date<b.date?-1:a.date>b.date?1:0)||(a.created-b.created)}
function derive(){
  M={};W=[];var st=null;
  Object.keys(docs).forEach(function(id){
    var d=docs[id]; if(!d||typeof d!=='object')return;
    if(d.kind==='movie'&&typeof d.title==='string')M[id]={id:id,title:d.title,norm:d.norm||norm(d.title),created:d.created||0,tmdb:(d.tmdb&&d.tmdb.id)?d.tmdb:null};
    else if(d.kind==='watch'&&Array.isArray(d.stars))W.push({id:id,movieId:d.movieId,n:Number(d.n)||1,date:d.date||'',stars:d.stars.map(Number),score:Number(d.score),comment:d.comment||'',created:d.created||0});
    else if(d.kind==='settings')st=d;
  });
  W=W.filter(function(w){return M[w.movieId]&&w.stars.length===5&&w.stars.every(isFinite)});
  WM={};W.forEach(function(w){(WM[w.movieId]=WM[w.movieId]||[]).push(w)});
  Object.keys(WM).forEach(function(k){WM[k].sort(cmpLatest)});
  settings={tiers:mergeTiers(st&&st.tiers)};
}

/* ---------- 保存層 ---------- */
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function withRetry(fn){
  for(var i=0;;i++){
    try{return await fn()}catch(e){
      var c=e&&e.code; if(i<3&&(c==='unavailable'||c==='resource_exhausted')){await sleep(500*(i+1));continue}
      throw e;
    }
  }
}
function saveLocal(){try{localStorage.setItem('movielog_docs_v1',JSON.stringify(docs));lsOK=true}catch(e){lsOK=false;toast('端末に保存できません（プライベートモードなど）')}}
function loadLocal(){try{var s=localStorage.getItem('movielog_docs_v1');if(s)docs=JSON.parse(s)||{}}catch(e){docs={}}}
async function put(id,obj,quiet){
  docs[id]=obj;derive();
  try{
    if(mode==='cloud')await withRetry(function(){return col.doc(id).set(obj)});else saveLocal();
  }catch(e){toast('保存に失敗しました');throw e}
  if(!quiet)refresh();
}
async function del(id,quiet){
  delete docs[id];derive();
  try{
    if(mode==='cloud')await withRetry(function(){return col.doc(id).delete()});else saveLocal();
  }catch(e){toast('削除に失敗しました');throw e}
  if(!quiet)refresh();
}

/* ---------- UI部品 ---------- */
var toastT=null;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2200)}
function dialog(o){
  return new Promise(function(res){
    var el=document.createElement('div');el.className='modal';
    el.innerHTML='<div class="mbox"><h3>'+esc(o.title||'')+'</h3><div class="mbody">'+(o.body||'')+'</div><div class="mbtns">'+(o.buttons||[]).map(function(b,i){return '<button class="btn '+(b.kind||'')+'" data-bi="'+i+'">'+esc(b.label)+'</button>'}).join('')+'</div></div>';
    function close(v){el.remove();res(v)}
    el.addEventListener('click',function(ev){
      var p=ev.target.closest('[data-pick]');if(p){close({pick:p.getAttribute('data-pick')});return}
      var b=ev.target.closest('[data-bi]');if(b){var val=o.buttons[Number(b.getAttribute('data-bi'))].value;if(o.collect&&val==='ok')val={ok:true,data:o.collect(el)};close(val);return}
      if(ev.target===el)close(null);
    });
    document.body.appendChild(el);
  });
}
function confirmDlg(title,msg,ok,danger){
  return dialog({title:title,body:'<p style="margin:0">'+esc(msg)+'</p>',buttons:[{label:'キャンセル',value:false},{label:ok,value:true,kind:danger?'danger':'primary'}]});
}
function fmt1(v){return Number(v).toFixed(1)}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h%360}

/* ---------- TMDB ---------- */
var lsOK=true;
function getKey(){try{return localStorage.getItem('movielog_tmdb_key')||''}catch(e){return ''}}
function setKey(k){try{if(k)localStorage.setItem('movielog_tmdb_key',k);else localStorage.removeItem('movielog_tmdb_key')}catch(e){}}
var tm={state:'idle',res:[],t:null,seq:0};
async function tmdbSearch(q){
  var url='https://api.themoviedb.org/3/search/movie?api_key='+encodeURIComponent(getKey())+'&language=ja-JP&include_adult=false&query='+encodeURIComponent(q);
  var r=await fetch(url);if(!r.ok)throw new Error('http '+r.status);
  var j=await r.json();
  return (j.results||[]).slice(0,8).map(function(x){return {id:x.id,title:x.title||x.original_title||'',orig:x.original_title||'',year:(x.release_date||'').slice(0,4),poster:x.poster_path||'',vote:Number(x.vote_average)||0,votes:Number(x.vote_count)||0}});
}
function tmdbInfo(r){return {id:r.id,poster:r.poster,year:r.year,vote:r.vote,votes:r.votes}}
function posterURL(t,w){return t&&t.poster?'https://image.tmdb.org/t/p/w'+w+t.poster:''}
function posterImg(path,w,cls){return path?'<img class="'+cls+'" src="https://image.tmdb.org/t/p/w'+w+path+'" loading="lazy" alt="">':'<span class="'+cls+'"></span>'}
function tmdbScheduleSearch(){
  clearTimeout(tm.t);var q=form.query.trim(),seq=++tm.seq;
  if(!getKey()||!q){tm.state='idle';tm.res=[];updateTitleList();return}
  tm.state='loading';updateTitleList();
  tm.t=setTimeout(async function(){
    try{var r=await tmdbSearch(q);if(seq!==tm.seq)return;tm.res=r;tm.state='ok'}
    catch(e){if(seq!==tm.seq)return;tm.res=[];tm.state='error'}
    updateTitleList();
  },450);
}
async function findOrLinkTmdb(res){
  var k=Object.keys(M).filter(function(x){return M[x].tmdb&&M[x].tmdb.id===res.id})[0];
  if(k)return k;
  var n=norm(res.title);
  k=Object.keys(M).filter(function(x){return !M[x].tmdb&&M[x].norm===n})[0];
  if(k){var d=clone(docs[k]);d.tmdb=tmdbInfo(res);await put(k,d,true);return k}
  return null;
}
async function autoLinkAll(){
  if(!getKey()){toast('先にTMDBキーを設定してください');return}
  var ids=Object.keys(M).filter(function(k){return !M[k].tmdb});
  if(!ids.length){toast('未紐づけの映画はありません');return}
  var ok=0,miss=0,stop=false,used={};
  Object.keys(M).forEach(function(k){if(M[k].tmdb)used[M[k].tmdb.id]=true});
  for(var i=0;i<ids.length;i++){
    $('#status').textContent='紐づけ中 '+(i+1)+'/'+ids.length;
    var m=M[ids[i]];if(!m)continue;
    try{
      var rs=await tmdbSearch(m.title),hit=null;
      for(var j=0;j<rs.length;j++){if(!used[rs[j].id]&&(norm(rs[j].title)===m.norm||norm(rs[j].orig)===m.norm)){hit=rs[j];break}}
      if(hit){var d=clone(docs[ids[i]]);d.tmdb=tmdbInfo(hit);used[hit.id]=true;await put(ids[i],d,true);ok++}else miss++;
    }catch(e){stop=true;break}
    await sleep(120);
  }
  refresh();
  toast(stop?'通信に失敗したため中断しました（'+ok+'本を紐づけ済み）':ok+'本を紐づけました'+(miss?'（'+miss+'本は候補が一致せず未紐づけ）':''));
}

function matchMovies(q){
  var qn=norm(q),list=Object.keys(M).map(function(k){return M[k]});
  function last(m){var ws=WM[m.id];if(!ws||!ws.length)return m.created;var l=ws.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.created-a.created})[0];return (new Date(l.date||0)).getTime()||l.created}
  if(!qn){return list.sort(function(a,b){return last(b)-last(a)}).slice(0,8).map(function(m){return {m:m,exact:false}})}
  var out=[];
  list.forEach(function(m){
    var n=m.norm,score=null;
    if(n===qn)score=0;else if(n.indexOf(qn)===0)score=1;else if(n.indexOf(qn)>=0||qn.indexOf(n)>=0)score=2;
    else{var d=lev(n,qn),lim=Math.max(n.length,qn.length)>=7?2:(Math.max(n.length,qn.length)>=4?1:0);if(d<=lim)score=3+d}
    if(score!==null)out.push({m:m,score:score,exact:score===0});
  });
  out.sort(function(a,b){return a.score-b.score});
  return out.slice(0,8);
}

    }
    if(!getKey())h+='<div class="note">「統計」タブでTMDBのAPIキーを設定すると、映画を検索して選べます。</div>';
  }else if(!res.length){h='<div class="note">映画名を入力して追加します。</div>'}
  return h;

/* ---------- ランキング ---------- */
function pickEntries(filter,keyFn){
  if(filter==='all')return W.slice();
  var by={};
  W.forEach(function(w){
    var c=by[w.movieId];
    if(!c){by[w.movieId]=w;return}
    if(filter==='latest'){if(cmpLatest(w,c)>0)by[w.movieId]=w}
    else{var a=keyFn(w),b=keyFn(c);if(a>b||(a===b&&cmpLatest(w,c)>0))by[w.movieId]=w}
  });
  return Object.keys(by).map(function(k){return by[k]});
}
function metricFn(k){
  if(k==='avg')return avgOf;
  if(k==='score')return function(w){return w.score};
  var i=Number(k.slice(1));return function(w){return w.stars[i]};
}
function fmtMetric(k,v){return k==='score'?v+'点':'★'+fmt1(v)}
function rankRows(list,valFn,fmtFn,subFn){
  var rows='';
  list.forEach(function(e,idx){
    var rank=1;for(var j=0;j<list.length;j++)if(valFn(list[j])>valFn(e)+1e-9)rank++;
    rows+='<div class="rk r'+(rank<=3?rank:0)+'"><div class="no">'+rank+'</div><div class="nm"><b>'+esc(e.title)+'</b><span>'+esc(subFn(e))+'</span></div><div class="val">'+fmtFn(valFn(e))+'</div></div>';
  });
  return rows;
}

  }
  return h+'</div>';

function tierOf(v,t){return v>=t.S?'S':v>=t.A?'A':v>=t.B?'B':v>=t.C?'C':'D'}
function viewTier(){
  var t=settings.tiers[tierMode],isStar=tierMode==='star';

  var fn=isStar?avgOf:function(w){return w.score};
  var groups={S:[],A:[],B:[],C:[],D:[]};
  pickEntries(tierFilter,fn).forEach(function(w){groups[tierOf(fn(w),t)].push(w)});
  TIER_ORDER.forEach(function(k){
    var arr=groups[k].sort(function(a,b){return fn(b)-fn(a)||M[a.movieId].title.localeCompare(M[b.movieId].title,'ja')});
    h+='<div class="tier"><div class="tl" style="background:'+TIER_COL[k]+'">'+k+'</div><div class="tb">'+(arr.length?arr.map(function(w){return '<span class="tc">'+esc(M[w.movieId].title)+(WM[w.movieId].length>1?'<i>'+w.n+'回目</i>':'')+'<em>'+(isStar?fmt1(fn(w)):fn(w))+'</em></span>'}).join(''):'<span class="muted small" style="align-self:center">—</span>')+'</div></div>';
  });
  h+='<div class="sec" style="margin-top:14px"><h3>ティアの基準（以上）を変更</h3><div class="tin">'+['S','A','B','C'].map(function(k){return '<div>'+k+'<input type="number" step="'+(isStar?'0.1':'1')+'" data-th="'+k+'" value="'+t[k]+'"></div>'}).join('')+'</div><div class="row" style="margin-top:10px"><span class="small muted grow">C未満はD。大きい順に設定してください。</span><button class="btn sm" data-a="thReset">初期値に戻す</button></div></div>';
  return h;
}

/* ---------- 統計・設定 ---------- */
function viewStat(){
  var movies=Object.keys(WM).length,re=Object.keys(WM).filter(function(k){return WM[k].length>1}).length;
  var h='<h2 style="margin-top:6px">統計</h2>';
  var avgAll=W.length?W.reduce(function(a,w){return a+avgOf(w)},0)/W.length:null;
  var scAll=W.length?W.reduce(function(a,w){return a+w.score},0)/W.length:null;
  h+='<div class="tiles"><div class="tile"><div class="n">'+W.length+'</div><div class="l">鑑賞回数（全部）</div></div><div class="tile"><div class="n">'+movies+'</div><div class="l">観た映画の本数</div></div><div class="tile"><div class="n">'+re+'</div><div class="l">複数回観た映画</div></div><div class="tile"><div class="n">'+(avgAll==null?'–':fmt1(avgAll))+'</div><div class="l">★平均の全体平均</div></div></div>';
  if(scAll!=null)h+='<div class="tiles" style="margin-top:10px"><div class="tile"><div class="n">'+scAll.toFixed(1)+'</div><div class="l">100点の全体平均</div></div></div>';
  if(W.length){
    h+='<div class="sec" style="margin-top:12px"><h3>項目別の平均</h3>';
    for(var i=0;i<5;i++){var a=W.reduce(function(s,w){return s+w.stars[i]},0)/W.length;h+='<div class="meter"><div class="a">'+ITEMS[i]+'</div><div class="bar"><i style="width:'+(a/5*100)+'%"></i></div><div class="b">'+fmt1(a)+'</div></div>'}
    h+='</div>';
  }
  h+='<h2>バックアップ</h2><div class="sec"><div class="small muted" style="margin-bottom:10px">'+(mode==='cloud'?'データはクラウドに保存され、別の端末でも同じ記録が見られます。':'データはこの端末のブラウザにだけ保存されます。ホーム画面に追加したアプリと、Safariで開いたページは保存場所が別です。消える場合があるので、ときどきバックアップを取ってください。')+'</div><div class="row" style="flex-wrap:wrap"><button class="btn sm" data-a="exp">ファイルに保存</button><button class="btn sm" data-a="expText">テキストで表示</button><label class="btn sm" for="impFile" style="margin:0">ファイルから復元</label><input id="impFile" type="file" accept=".json,application/json" style="display:none"></div><div id="bkArea"></div></div><h2>TMDB（映画検索・ポスター）</h2><div class="sec"><div class="small muted" style="margin-bottom:10px">TMDBのAPIキーを入れると、映画を検索して選べます。キーはこの端末にだけ保存されます。</div><input id="tmKey" type="password" autocomplete="off" placeholder="APIキーを貼り付け" value="'+esc(getKey())+'"><div class="row" style="flex-wrap:wrap;margin-top:10px"><button class="btn sm" data-a="autoLink">未紐づけの映画を自動で紐づけ</button><button class="btn sm danger" data-a="keyDel">キーを削除</button></div><div class="small muted" style="margin-top:10px">This product uses the TMDB API but is not endorsed or certified by TMDB.</div></div><h2>リセット</h2><div class="sec"><div class="small muted" style="margin-bottom:10px">記録・登録した映画・ティアの基準を、すべて削除して最初の状態に戻します。</div><button class="btn sm danger" data-a="resetAll">すべてのデータを削除</button></div>';
  return h;
}

/* ---------- 描画 ---------- */
var VIEWS={record:viewRecord,lib:viewLib,rank:viewRank,tier:viewTier,stat:viewStat};
var AFTER={record:afterRecord,lib:afterLib,rank:afterRank};
function renderNav(){$('#nav').innerHTML=TABS.map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" data-a="tab" data-t="'+t[0]+'"><span class="ic">'+t[1]+'</span>'+t[2]+'</button>'}).join('')}
function renderStatus(){
  var s=$('#status');
  if(mode==='cloud')s.textContent=loaded?(loadSlow?'☁ 同期待ち':'☁ 保存先：クラウド'):(loadSlow?'☁ 接続できません':'☁ 読み込み中…');
  else if(mode==='local')s.textContent=lsOK?'この端末に保存':'⚠ 保存できません';
  else s.textContent='読み込み中…';
}
function renderMain(){var m=$('#main');m.innerHTML=VIEWS[tab]();if(AFTER[tab])AFTER[tab]();renderNav();renderStatus()}
function refresh(){
  var a=document.activeElement,typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='file';
  if(typing){dirty=true;if(tab==='record')updateTitleList();if(detailId)renderDetail();renderStatus();return}
  renderMain();if(detailId)renderDetail();
}
function scrollTop0(){var m=$('#main');if(m)m.scrollTop=0}
function go(t){tab=t;detailId=null;$('#detail').classList.remove('on');renderMain();scrollTop0()}

/* ---------- 保存処理 ---------- */
async function saveForm(){
  var btn=$('#saveBtn');
  if(!form.sel)return;
  var a=curAvg();
  if(a==null){toast('星を5項目すべてつけてください（該当なしは0）');return}
  var sc=form.score===''?NaN:Number(form.score);
  if(!isFinite(sc)||sc<0||sc>100||Math.floor(sc)!==sc){toast('100点を0〜100の整数で入力してください');return}
  if(!form.date)form.date=todayStr();
  if(btn)btn.disabled=true;
  try{
    var movieId=form.sel.id;
    if(!movieId){
      var title=form.sel.title.trim(),nn=norm(title);
      var tid=form.sel.tmdb&&form.sel.tmdb.id;
      var ex=Object.keys(M).filter(function(k){return (tid&&M[k].tmdb&&M[k].tmdb.id===tid)||M[k].norm===nn})[0];
      if(ex)movieId=ex;else{movieId=newId('m');var md={kind:'movie',title:title,norm:nn,created:Date.now()};if(form.sel.tmdb)md.tmdb=form.sel.tmdb;await put(movieId,md,true)}
    }
    var wid=form.watchId||newId('w'),old=docs[wid];
    await put(wid,{kind:'watch',movieId:movieId,n:form.n,date:form.date,stars:form.stars.slice(),score:sc,comment:form.comment.trim(),created:(old&&old.created)||Date.now()},true);
    form=newForm();toast('保存しました');
    tab='lib';detailId=movieId;renderMain();renderDetail();scrollTop0();
  }catch(e){if(btn)btn.disabled=false}
}
function startRecordFor(movieId){
  var ws=WM[movieId]||[],mx=ws.reduce(function(a,w){return Math.max(a,w.n)},0);
  form=newForm();form.sel={id:movieId};form.n=mx+1;go('record');
}
async function registerTitles(list){
  var seen={},added=0,skipped=0,lastId=null;
  Object.keys(M).forEach(function(k){seen[M[k].norm]=true});
  for(var i=0;i<list.length;i++){
    var t=String(list[i]).trim();if(!t)continue;
    var n=norm(t);if(!n||seen[n]){skipped++;continue}
    seen[n]=true;lastId='m_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+i;
    await put(lastId,{kind:'movie',title:t,norm:n,created:Date.now()+i},true);added++;
  }
  return {added:added,skipped:skipped};
}
async function mergeMovie(fromId){
  var others=Object.keys(M).filter(function(k){return k!==fromId}).sort(function(a,b){return M[a].title.localeCompare(M[b].title,'ja')});
  if(!others.length){toast('統合できる他の映画がありません');return}
  var r=await dialog({title:'どの映画に統合しますか？',body:'<div class="small muted">「'+esc(M[fromId].title)+'」の記録を移します。</div>'+others.map(function(k){return '<button class="li" data-pick="'+k+'"><span class="t">'+esc(M[k].title)+'</span><span class="s">'+(WM[k]||[]).length+'回</span></button>'}).join(''),buttons:[{label:'キャンセル',value:null}]});
  if(!r||!r.pick)return;
  var to=r.pick;
  var ok=await confirmDlg('統合しますか？','「'+M[fromId].title+'」の記録を「'+M[to].title+'」に統合します。回数は鑑賞日の順に振り直します。','統合する');
  if(!ok)return;
  try{
    var all=(WM[fromId]||[]).concat(WM[to]||[]).slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.created-b.created});
    for(var i=0;i<all.length;i++){
      var w=all[i];
      if(w.movieId!==to||w.n!==i+1){var d=clone(docs[w.id]);d.movieId=to;d.n=i+1;await put(w.id,d,true)}
    }
    await del(fromId,true);
    detailId=to;refresh();toast('統合しました');
  }catch(e){refresh()}
}

/* ---------- バックアップ ---------- */
function backupJSON(){return JSON.stringify({app:'movielog',version:1,exported:new Date().toISOString(),docs:docs})}
async function importDocs(text){
  var obj;try{obj=JSON.parse(text)}catch(e){toast('ファイルの形式が正しくありません');return}
  var d=obj&&obj.docs;if(!d||typeof d!=='object'){toast('バックアップデータが見つかりません');return}
  var ids=Object.keys(d).filter(function(id){var x=d[id];return x&&typeof x==='object'&&(x.kind==='movie'||x.kind==='watch'||x.kind==='settings')&&/^[A-Za-z0-9_\-]{1,100}$/.test(id)});
  if(!ids.length){toast('復元できるデータがありません');return}
  var ok=await confirmDlg('復元しますか？',ids.length+'件のデータを取り込みます（同じIDの記録は上書きされます）。','復元する');
  if(!ok)return;
  try{
    for(var i=0;i<ids.length;i++){await put(ids[i],d[ids[i]],true)}
    toast('復元しました');refresh();
  }catch(e){refresh()}
}

/* ---------- イベント ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;
  var a=t.getAttribute('data-a'),id=t.getAttribute('data-id'),v=t.getAttribute('data-v');
  switch(a){
    case 'tab':go(t.getAttribute('data-t'));break;
    case 'pick':form.sel={id:id};var ws=WM[id]||[];form.n=ws.reduce(function(x,w){return Math.max(x,w.n)},0)+1;renderMain();break;
    case 'addnew':form.sel={title:form.query.trim()};form.n=1;renderMain();break;
    case 'regOnly':(async function(){var q=form.query.trim();if(!q)return;try{var r=await registerTitles([q]);form.query='';toast(r.added?'「'+q+'」を登録しました':'すでに登録済みです');renderMain()}catch(err){}})();break;
    case 'regBulk':(async function(){var r=await dialog({title:'映画を登録',body:'<div class="small muted" style="margin-bottom:8px">知っている映画を先に登録できます。1行に1本ずつ入力してください。評価は後から記録できます。</div><textarea id="regText" placeholder="例：\nインセプション\nトイ・ストーリー" style="min-height:140px"></textarea>',buttons:[{label:'キャンセル',value:null},{label:'登録する',value:'ok',kind:'primary'}],collect:function(el){return el.querySelector('#regText').value}});if(!r||!r.ok)return;var lines=String(r.data||'').split(/\r?\n/);try{var res=await registerTitles(lines);refresh();toast(res.added+'本を登録しました'+(res.skipped?'（登録済み・重複'+res.skipped+'本はスキップ）':''))}catch(err){refresh()}})();break;
    case 'libV':libView=libView==='list'?'grid':'list';renderMain();break;
    case 'resetAll':(async function(){var n=Object.keys(docs).length;if(!n){toast('削除するデータはありません');return}if(!await confirmDlg('すべて削除しますか？','登録した映画と記録、設定をすべて削除します（'+n+'件）。元に戻せません。必要なら先にバックアップを取ってください。','すべて削除する',true))return;try{var ids=Object.keys(docs);for(var i=0;i<ids.length;i++)await del(ids[i],true);form=newForm();detailId=null;libQuery='';refresh();toast('リセットしました')}catch(err){refresh()}})();break;
    case 'pickT':(async function(){var r=tm.res[Number(t.getAttribute('data-i'))];if(!r)return;try{var ex=await findOrLinkTmdb(r);if(ex){form.sel={id:ex};form.n=(WM[ex]||[]).reduce(function(x,w){return Math.max(x,w.n)},0)+1}else{form.sel={title:r.title,tmdb:tmdbInfo(r)};form.n=1}renderMain()}catch(err){}})();break;
    case 'regT':(async function(){var r=tm.res[Number(t.getAttribute('data-i'))];if(!r)return;try{var ex=await findOrLinkTmdb(r);if(ex)toast('登録済みです');else{await put(newId('m'),{kind:'movie',title:r.title,norm:norm(r.title),created:Date.now(),tmdb:tmdbInfo(r)},true);toast('「'+r.title+'」を登録しました')}updateTitleList()}catch(err){}})();break;
    case 'link':linkTmdb(id);break;
    case 'autoLink':autoLinkAll();break;
    case 'keyDel':setKey('');toast('キーを削除しました');renderMain();break;
    case 'unpick':form.sel=null;renderMain();break;
    case 'nm':form.n=Math.max(1,form.n-1);$('#nv').textContent=form.n+'回目';break;
    case 'np':form.n=Math.min(99,form.n+1);$('#nv').textContent=form.n+'回目';break;
    case 'star':{var r=Number(t.getAttribute('data-r'));form.stars[r]=Number(v);paintRow(r);updateAvg();break}
    case 'save':saveForm();break;
    case 'cancelEdit':form=newForm();go('lib');break;
    case 'open':detailId=id;renderDetail();break;
    case 'closeDetail':detailId=null;renderDetail();break;
    case 'rewatch':startRecordFor(id);break;
    case 'merge':mergeMovie(id);break;
    case 'delMovie':(async function(){var n=(WM[id]||[]).length;if(!await confirmDlg('映画を削除しますか？','「'+M[id].title+'」と、その'+n+'件の記録をすべて削除します。元に戻せません。','削除する',true))return;try{var ws=(WM[id]||[]).slice();for(var i=0;i<ws.length;i++)await del(ws[i].id,true);await del(id,true);detailId=null;refresh();toast('削除しました')}catch(e){refresh()}})();break;
    case 'editW':{var w=docs[id];if(!w)break;form={watchId:id,sel:{id:w.movieId},query:'',n:Number(w.n)||1,stars:w.stars.map(Number),score:String(w.score),comment:w.comment||'',date:w.date||todayStr()};go('record');break}
    case 'delW':(async function(){var w=docs[id];if(!w)return;var last=(WM[w.movieId]||[]).length<=1;if(!await confirmDlg('記録を削除しますか？',last?'この記録を削除します。映画は一覧に残ります（未記録になります）。':'この記録を削除します。元に戻せません。','削除する',true))return;try{await del(id,true);refresh();toast('削除しました')}catch(e){refresh()}})();break;
    case 'rkF':rankFilter=v;renderMain();break;
    case 'tMode':tierMode=v;renderMain();break;
    case 'tFilt':tierFilter=v;renderMain();break;
    case 'thReset':(async function(){var s=clone(settings);s.tiers[tierMode]=clone(DEF_TIERS[tierMode]);await put('settings',{kind:'settings',tiers:s.tiers})})();break;
    case 'exp':(async function(){if(!dlApi){toast('この画面ではファイル保存できません。「テキストで表示」を使ってください');return}try{var d=new Date();await dlApi.save({filename:'movielog-backup-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.json',data:backupJSON()})}catch(err){if(!err||err.code!=='declined')toast('保存できませんでした')}})();break;
    case 'expText':{var ar=$('#bkArea');ar.innerHTML='<textarea id="bkText" readonly style="margin-top:10px;min-height:120px"></textarea><div class="row" style="margin-top:8px"><button class="btn sm" data-a="copyBk">コピー</button></div><div class="small muted" style="margin-top:12px">復元：バックアップのテキストを貼り付けて実行</div><textarea id="bkIn" style="margin-top:6px" placeholder="ここにバックアップのテキストを貼り付け"></textarea><div class="row" style="margin-top:8px"><button class="btn sm" data-a="impText">貼り付けから復元</button></div>';$('#bkText').value=backupJSON();break}
    case 'copyBk':(function(){var el=$('#bkText');el.focus();el.select();try{navigator.clipboard.writeText(el.value).then(function(){toast('コピーしました')},function(){toast('選択しました。手動でコピーしてください')})}catch(err){toast('選択しました。手動でコピーしてください')}})();break;
    case 'impText':importDocs($('#bkIn').value);break;
  }
});
document.addEventListener('input',function(e){
  var t=e.target,id=t.id;
  if(id==='fq'){form.query=t.value;tmdbScheduleSearch()}
  else if(id==='fscore')form.score=t.value;
  else if(id==='fcm')form.comment=t.value;
  else if(id==='fdate')form.date=t.value;
  else if(id==='libQ'){libQuery=t.value;$('#libGrid').innerHTML=libGridHTML()}
});
document.addEventListener('change',function(e){
  var t=e.target,id=t.id;
  if(id==='libS'){libSort=t.value;$('#libGrid').innerHTML=libGridHTML()}
  else if(id==='rkM'){rankMetric=t.value;renderMain()}
  else if(t.hasAttribute&&t.hasAttribute('data-th')){
    var s=clone(settings.tiers);var all=document.querySelectorAll('[data-th]');
    for(var i=0;i<all.length;i++){var v=Number(all[i].value);if(!isFinite(v)){toast('数字で入力してください');renderMain();return}s[tierMode][all[i].getAttribute('data-th')]=v}
    put('settings',{kind:'settings',tiers:s});
  }
  else if(id==='tmKey'){setKey(t.value.trim());toast(t.value.trim()?'キーを保存しました':'キーを削除しました')}
  else if(id==='impFile'&&t.files&&t.files[0]){var f=t.files[0],rd=new FileReader();rd.onload=function(){importDocs(String(rd.result))};rd.readAsText(f);t.value=''}
});
document.addEventListener('focusout',function(){if(dirty){setTimeout(function(){var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;dirty=false;refresh()},120)}});

/* ---------- 起動 ---------- */
(function(){
  dlApi={save:async function(o){var b=new Blob([o.data],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)}};
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  mode='local';loadLocal();derive();loaded=true;renderMain();
})();
</script>
